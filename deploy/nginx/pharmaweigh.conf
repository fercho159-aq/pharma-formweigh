# nginx del host para PharmaWeigh. Copiar a /etc/nginx/sites-available/pharmaweigh
# y enlazar en sites-enabled/. TLS:
#   certbot --nginx -d pharmaweigh.appsoluciones.duckdns.org
# (certbot reescribe este archivo agregando el listen 443, el certificado y la
#  redirección 80 -> 443; por eso aquí solo va el :80).
#
# El reverse proxy real del VPS es nginx + certbot. El contenedor root-traefik-1
# es legado y no controla 80/443.

# Freno de red a los POST de autenticación y de firma. Holgado a propósito: en planta todas las
# estaciones salen por la misma IP y un cambio de turno son muchos logins legítimos a la vez.
# El bloqueo fino (5 fallos por correo / 15 min) lo hace la aplicación (ADR-003).
limit_req_zone $binary_remote_addr zone=pharmaweigh_login:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name pharmaweigh.appsoluciones.duckdns.org;

    # PharmaWeigh no recibe archivos: solo formularios JSON pequeños.
    client_max_body_size 1m;

    access_log /var/log/nginx/pharmaweigh.access.log;
    error_log  /var/log/nginx/pharmaweigh.error.log;

    location ~ ^/api/(auth/login|dispensado/firmar)$ {
        limit_req zone=pharmaweigh_login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3062;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3062;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Upgrade para el HMR de dev y por si más adelante hay SSE/websocket.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
